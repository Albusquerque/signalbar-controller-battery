  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;sb-motion-lab&#x27;);

      const state={scene:&#x27;charging&#x27;,variant:0,battery:41,where:&#x27;everywhere&#x27;,glow:0.9,speed:1};
      const content={
        connect:{title:&#x27;Controller 2&#x27;,status:&#x27;Connected&#x27;,variants:[[&#x27;Magnetic welcome&#x27;,&#x27;Two soft currents meet, create a quick white glint, then reveal the actual battery.&#x27;],[&#x27;Arc return&#x27;,&#x27;A fine point traverses the bar, returns with a fading echo, then the charge settles.&#x27;],[&#x27;Twin bloom&#x27;,&#x27;Two points emerge at the centre, open outward, and leave a calm battery gauge.&#x27;]]},
        gauge:{title:&#x27;Controller 2&#x27;,status:&#x27;Battery gauge&#x27;,variants:[[&#x27;Quiet fill&#x27;,&#x27;A still gauge. Motion is reserved for a meaningful change.&#x27;],[&#x27;Bright tip&#x27;,&#x27;A white tip marks the exact end of the battery fill.&#x27;],[&#x27;Soft horizon&#x27;,&#x27;A broad lower-intensity glow, with a precise end marker.&#x27;]]},
        low:{title:&#x27;Controller 2&#x27;,status:&#x27;Low battery&#x27;,variants:[[&#x27;Last ember&#x27;,&#x27;The bar collapses to the remaining charge, then two warm warning beats.&#x27;],[&#x27;Signal flare&#x27;,&#x27;A red warning ripples from the remaining charge to the far edge and back.&#x27;],[&#x27;Afterglow&#x27;,&#x27;A vivid double pulse resolves into a dim, steady red remainder.&#x27;]]},
        charging:{title:&#x27;Controller 2&#x27;,status:&#x27;Charging · continuous&#x27;,variants:[[&#x27;Photon current&#x27;,&#x27;A white particle crosses only the charged area and gently melts into its bright tip.&#x27;],[&#x27;Tidal fill&#x27;,&#x27;A broad wave of light rolls through the filled area, rests, then begins again.&#x27;],[&#x27;Spark lattice&#x27;,&#x27;Small highlights follow each other through the charge and gather at the tip.&#x27;]]},
        duo:{title:&#x27;P1 96% · P2&#x27;,status:&#x27;Two controllers&#x27;,variants:[[&#x27;Twin reveal&#x27;,&#x27;Both coloured gauges grow from the outer edges. The centre LED is always dark.&#x27;],[&#x27;Two signatures&#x27;,&#x27;A highlight travels from each outer edge towards its own gauge tip: left, then right.&#x27;],[&#x27;Mirror greeting&#x27;,&#x27;Two matching streams approach the centre, pause, then return to the outer edges.&#x27;]]}
      };
      const leds=Array.from({length:17},()=&gt;{const e=document.createElement(&#x27;i&#x27;);q(&#x27;.sb-logic&#x27;).appendChild(e);return e});
      let epoch=performance.now(),chargeStart=0,chargeFrom=41,finishAt=-999;
      const clamp=(v,a,b)=&gt;Math.min(b,Math.max(a,v));
      const ease=x=&gt;{const y=clamp(x,0,1);return y*y*(3-2*y)};
      function blank(){return Array(17).fill(OFF)}
      function put(a,i,c){if(i&gt;=0&amp;&amp;i&lt;17)a[i]=c}
      function fill(a,x,y,c){for(let i=Math.max(0,x);i&lt;=Math.min(16,y);i++)put(a,i,c)}
      function restoredFrame(){const a=blank();fill(a,0,4,&#x27;#5a8fa2&#x27;);fill(a,5,8,&#x27;#6c8da9&#x27;);fill(a,9,11,&#x27;#8e8fb2&#x27;);return a}
      function gauge(a,percent,color=MINT,tip=false){const n=Math.max(percent&gt;0?1:0,Math.round(percent/100*17));fill(a,0,n-1,color);if(tip&amp;&amp;n)put(a,n-1,WHITE)}
      function duoBase(t,animated){
        const a=blank(),left=Math.round(.96*8),right=Math.max(state.battery&gt;0?1:0,Math.round(state.battery/100*8));
        const progress=animated?ease(t/1.45):1;
        const nl=Math.round(left*progress),nr=Math.round(right*progress);
        fill(a,0,nl-1,MINT);fill(a,17-nr,16,AMBER);
        put(a,8,OFF);
        return a;
      }
      function frame(t){
        const a=blank(),v=state.variant,s=state.scene,b=state.battery,n=Math.max(b&gt;0?1:0,Math.round(b/100*17));
        if(s===&#x27;gauge&#x27;){gauge(a,b,v===2?SOFT:MINT,v!==0);return a}
        if(s===&#x27;charging&#x27;){
          if(b&gt;=100){const f=(performance.now()-finishAt)/1000;if(f&gt;=0&amp;&amp;f&lt;.9){gauge(a,100,MINT,false);let spread=Math.floor(ease(f/.9)*9);fill(a,8-spread,8+spread,f&lt;.42?WHITE:MINT);return a}return restoredFrame()}
          gauge(a,b,CYAN,false);
          if(!n||state.where===&#x27;off&#x27;)return a;
          const phase=t%(v===1?3.2:2.55);
          if(v===0){const pos=Math.floor(ease(phase/1.95)*n);if(phase&lt;1.95){put(a,Math.min(n-1,pos),WHITE);put(a,pos-1,&#x27;#baf5f0&#x27;)}else put(a,n-1,WHITE)}
          if(v===1){const center=ease(phase/2.75)*(n+3)-2;for(let i=0;i&lt;n;i++){const d=Math.abs(i-center);if(d&lt;2.8)put(a,i,d&lt;1?WHITE:&#x27;#9de8ea&#x27;)}put(a,n-1,WHITE)}
          if(v===2){const p=phase/2.15;for(let k=0;k&lt;3;k++){const x=Math.floor(((p+k/3)%1)*n);if(phase&lt;2.15)put(a,x,k===0?WHITE:&#x27;#a4f1ef&#x27;)}put(a,n-1,WHITE)}
          return a;
        }
        if(s===&#x27;duo&#x27;){
          const phase=t%5.6;
          if(v===0)return duoBase(phase,true);
          if(v===1){const out=duoBase(0,false),leftMax=7,rightCount=Math.max(state.battery&gt;0?1:0,Math.round(state.battery/100*8));
            if(phase&lt;1.7){put(out,Math.min(leftMax,Math.floor(ease(phase/1.7)*(leftMax+1))),WHITE)}
            else if(phase&lt;3.3&amp;&amp;rightCount){put(out,16-Math.min(rightCount-1,Math.floor(ease((phase-1.7)/1.6)*rightCount)),WHITE)}return out}
          const out=duoBase(0,false),inner=7;
          if(phase&lt;3.4){const step=phase&lt;1.45?Math.round(ease(phase/1.45)*inner):phase&lt;1.9?inner:Math.round((1-ease((phase-1.9)/1.45))*inner);put(out,step,WHITE);put(out,16-step,WHITE)}return out;
        }
        if(s===&#x27;connect&#x27;){
          const phase=t%6.0;
          if(v===0){if(phase&lt;1.3){const k=Math.floor(ease(phase/1.3)*8);put(a,k,CYAN);put(a,16-k,CYAN);put(a,k-1,&#x27;#8eeaee&#x27;);put(a,17-k,&#x27;#8eeaee&#x27;)}else if(phase&lt;1.75){fill(a,6,10,WHITE)}else gauge(a,b,MINT,true)}
          if(v===1){if(phase&lt;2.3){let x=Math.floor(ease(phase&lt;1.15?phase/1.15:2-phase/1.15)*16);put(a,x,WHITE);put(a,x-1,CYAN);put(a,x+1,CYAN)}else gauge(a,b,MINT,true)}
          if(v===2){if(phase&lt;1.65){let k=Math.floor(ease(phase/1.65)*8);put(a,8-k,WHITE);put(a,8+k,WHITE);put(a,7-k,CYAN);put(a,9+k,CYAN)}else gauge(a,b,MINT,true)}
          return a;
        }
        if(s===&#x27;low&#x27;){
          const phase=t%6.2,low=Math.min(17,Math.max(1,Math.round(b/100*17)));
          if(v===0){if(phase&lt;1.25){fill(a,0,Math.max(low-1,Math.round((1-ease(phase/1.25))*16)),AMBER)}else{fill(a,0,low-1,RED);if((phase&gt;1.5&amp;&amp;phase&lt;1.73)||(phase&gt;1.91&amp;&amp;phase&lt;2.15))put(a,low-1,WHITE)}}
          if(v===1){fill(a,0,low-1,RED);if(phase&lt;2.4){let k=Math.floor((phase&lt;1.2?phase/1.2:2-phase/1.2)*16);put(a,k,WHITE);put(a,k-1,RED);put(a,k+1,RED)}}
          if(v===2){fill(a,0,low-1,phase&lt;2.2&amp;&amp;((phase%.92)&lt;.24||(phase%.92)&gt;.38&amp;&amp;(phase%.92)&lt;.58)?WHITE:RED);if(phase&lt;2.2&amp;&amp;phase%.92&lt;.24){put(a,8,RED);put(a,7,AMBER);put(a,9,AMBER)}}
          return a;
        }
        return a;
      }
      function updateInfo(){
        const s=state.scene,desc=content[s],variation=desc.variants[state.variant];
        q(&#x27;.sb-main&#x27;).textContent=s===&#x27;duo&#x27;?`P1 96% · P2 ${state.battery}%`:`Controller 2 · ${state.battery}%`;
        q(&#x27;.sb-status&#x27;).textContent=s===&#x27;charging&#x27;?(state.battery&gt;=100?&#x27;Fully charged · previous signal restored&#x27;:state.where===&#x27;off&#x27;?&#x27;Charging animation off&#x27;:&#x27;Charging · continuous&#x27;):desc.status;
        q(&#x27;.sb-hud-left&#x27;).textContent=s===&#x27;duo&#x27;?&#x27;Two controllers&#x27;:&#x27;Controller 2&#x27;;
        q(&#x27;.sb-hud-right&#x27;).textContent=s===&#x27;duo&#x27;?`96% · ${state.battery}%`:`${state.battery}%${s===&#x27;charging&#x27;&amp;&amp;state.battery&lt;100?&#x27; · charging&#x27;:&#x27;&#x27;}`;
        q(&#x27;.sb-hud-right&#x27;).style.color=s===&#x27;low&#x27;?RED:s===&#x27;charging&#x27;?CYAN:s===&#x27;duo&#x27;?AMBER:MINT;
        q(&#x27;.sb-caption&#x27;).textContent=s===&#x27;charging&#x27;?(state.battery&gt;=100?&#x27;At 100%, the moving highlight ends and the previous signal returns.&#x27;:&#x27;The fill means battery level. The moving light means charging is in progress.&#x27;):s===&#x27;duo&#x27;?&#x27;8 LEDs per controller. Both gauges grow from the outer edges; the centre LED stays off.&#x27;:s===&#x27;gauge&#x27;?&#x27;A stable level; no perpetual flourish when nothing changes.&#x27;:&#x27;Demo repeats here. The actual alert would play once, then restore the prior signal.&#x27;;
        const ruler=q(&#x27;.sb-ruler&#x27;).children;
        ruler[0].textContent=s===&#x27;duo&#x27;?&#x27;P1 · EDGE →&#x27;:&#x27;LEFT&#x27;;
        ruler[1].textContent=s===&#x27;duo&#x27;?&#x27;CENTRE OFF&#x27;:&#x27;LED 9 · CENTRE&#x27;;
        ruler[2].textContent=s===&#x27;duo&#x27;?&#x27;← EDGE · P2&#x27;:&#x27;RIGHT&#x27;;
        q(&#x27;.sb-detail&#x27;).textContent=variation[1];
        q(&#x27;.sb-logic&#x27;).setAttribute(&#x27;aria-label&#x27;,`${desc.title} ${state.battery} percent. ${variation[0]}. ${s===&#x27;charging&#x27;&amp;&amp;state.battery&gt;=100?&#x27;Charging animation stopped.&#x27;:&#x27;&#x27;}`);
        q(&#x27;#sb-motion-battery-value&#x27;).textContent=`${state.battery}%`;
        q(&#x27;#sb-motion-battery&#x27;).value=state.battery;
        q(&#x27;#sb-motion-charge&#x27;).disabled=state.battery&gt;=100;
        root.querySelectorAll(&#x27;.sb-tab&#x27;).forEach(x=&gt;x.setAttribute(&#x27;aria-pressed&#x27;,String(x.dataset.scene===s)));
        q(&#x27;.sb-choices&#x27;).replaceChildren(...desc.variants.map(([name],index)=&gt;{const button=document.createElement(&#x27;button&#x27;);button.type=&#x27;button&#x27;;button.className=&#x27;sb-choice cursor-interaction&#x27;;button.textContent=`${String.fromCharCode(65+index)} · ${name}`;button.setAttribute(&#x27;aria-pressed&#x27;,String(index===state.variant));button.addEventListener(&#x27;click&#x27;,()=&gt;{state.variant=index;epoch=performance.now();updateInfo();draw();save()});return button}));
      }
      function draw(){
        const now=performance.now();
